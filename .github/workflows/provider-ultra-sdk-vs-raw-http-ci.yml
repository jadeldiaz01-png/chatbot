name: provider-ultra-sdk-vs-raw-http-ci

on:
  pull_request:
    paths:
      - 'scripts/provider_ultra_sdk_vs_raw_http.py'
      - 'tests/test_provider_ultra_sdk_vs_raw_http.py'
      - '.github/workflows/provider-ultra-sdk-vs-raw-http-ci.yml'
      - '.github/workflows/provider-ultra-sdk-vs-raw-http-live.yml'
      - 'scripts/provider_ultra_transport_diagnostic.py'
      - 'scripts/provider_ultra_raw_http_stream_vs_nonstream.py'
      - 'requirements.lock'

permissions:
  contents: read

jobs:
  validate-offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable PR revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install frozen runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir --only-binary=:all: --require-hashes -r requirements.lock

      - name: Validate SDK vs raw HTTP diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/provider_ultra_sdk_vs_raw_http.py tests/test_provider_ultra_sdk_vs_raw_http.py
          python tests/test_provider_ultra_sdk_vs_raw_http.py
          python - <<'PY'
          from pathlib import Path
          source = Path('scripts/provider_ultra_sdk_vs_raw_http.py').read_text()
          required = (
              'EXPERIMENT_NAME = "provider_ultra_sdk_vs_raw_http"',
              'REPETITIONS = 20',
              'SLO_SECONDS = 8.0',
              'PACING_SECONDS = 12.0',
              'REQUEST_TIMEOUT_SECONDS = 15.0',
              'MAX_RETRIES = 0',
              'EXECUTION_MODE = "four_condition_latin_square_sequential_paced"',
              '"sdk_stream"', '"raw_stream"', '"sdk_nonstream"', '"raw_nonstream"',
              'run_sdk_stream_call(', 'run_sdk_nonstream_call(', 'run_raw_call(',
              'FUNCTIONAL_CONFIGURATION_CHANGED = False',
              'PROMOTION_AUTHORIZED = False',
              'SENSITIVE_PAYLOADS_RECORDED = False',
          )
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit(f'diagnostic contract incomplete: {missing}')
          forbidden_payload = ('response.text', 'response.content', 'response.json(', 'str(exc)')
          unsafe = [item for item in forbidden_payload if item in source]
          if unsafe:
              raise SystemExit(f'sensitive response payload surface present: {unsafe}')
          print('PROVIDER_ULTRA_SDK_VS_RAW_HTTP_SOURCE=PASS')
          PY

      - name: Prove CI is offline only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/provider-ultra-sdk-vs-raw-http-ci.yml').read_text()
          forbidden = (
              'workflow_' + 'dispatch:',
              'push' + ':',
              'schedule' + ':',
              'NVIDIA_' + 'API_KEY',
              'secrets' + '.',
          )
          present = [item for item in forbidden if item in workflow]
          if present:
              raise SystemExit(f'offline-only boundary violated: {present}')
          print('PROVIDER_ULTRA_SDK_VS_RAW_HTTP_OFFLINE_ONLY=PASS')
          PY

      - name: Validate governed live boundary offline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          live = Path('.github/workflows/provider-ultra-sdk-vs-raw-http-live.yml').read_text()
          required = (
              'workflow_' + 'dispatch:',
              'expected_main_sha:',
              'refs/heads/main',
              'EXPECTED_MAIN_SHA',
              'GITHUB_SHA',
              'environment: model-evaluation',
              'NVIDIA_' + 'API_KEY',
              'provider_ultra_sdk_vs_raw_http.py',
              'total_planned_calls',
              "'promotion_authorized': False",
              'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a',
              'cancel-in-progress: false',
          )
          missing = [item for item in required if item not in live]
          if missing:
              raise SystemExit(f'governed live boundary incomplete: {missing}')

          forbidden_triggers = (
              'pull_' + 'request:',
              'push' + ':',
              'schedule' + ':',
          )
          present = [item for item in forbidden_triggers if item in live]
          if present:
              raise SystemExit(f'live boundary has automatic trigger: {present}')

          if live.count('NVIDIA_' + 'API_KEY') != 3:
              raise SystemExit('unexpected NVIDIA_API_KEY surface count')

          print('PROVIDER_ULTRA_SDK_VS_RAW_HTTP_LIVE_BOUNDARY=PASS')
          PY
