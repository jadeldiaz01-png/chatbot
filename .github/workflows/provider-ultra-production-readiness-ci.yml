name: provider-ultra-production-readiness-ci

on:
  pull_request:
    paths:
      - 'evidence/provider-ultra-production-readiness.json'
      - '.github/workflows/provider-ultra-production-readiness-ci.yml'

permissions:
  contents: read

jobs:
  validate-readiness-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable PR revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Validate production readiness manifest offline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path('evidence/provider-ultra-production-readiness.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          assert data['schema_version'] == '1.0'
          assert data['repository'] == 'jadeldiaz01-png/chatbot'
          assert data['evidence_anchor_main_sha'] == '3faf9fa295ec36e5408e49493c4c9af1c485eeb8'
          assert data['provider'] == 'nvidia_nim'
          assert data['model'] == 'nvidia/nemotron-3-ultra-550b-a55b'
          assert data['target_p95_seconds'] == 8.0
          assert data['production_authorized'] is False
          assert data['promotion_authorized'] is False
          assert data['current_runtime']['provider'] == 'openai'
          assert data['current_runtime']['migration_to_nvidia_active'] is False
          assert data['total_certified_provider_calls'] == 220

          evidence = data['certified_evidence']
          assert len(evidence) == 3
          assert sum(item['calls'] for item in evidence) == 220
          assert all(item['errors'] == 0 for item in evidence)

          expected = {
              'provider_ultra_raw_http_stream_vs_nonstream_confirmatory': {
                  'run_id': 36793223794,
                  'git_sha': '97d80bc5b33cf3ebe5ec8532dc673eba5040b2d8',
                  'artifact_id': 11133666203,
                  'artifact_digest': 'sha256:da856e1673d9e279558af80072a7599903707674559002708d374858526b02d4',
                  'calls': 120,
              },
              'provider_ultra_sdk_vs_raw_http': {
                  'run_id': 36802554934,
                  'git_sha': '33f99117e79847146c4b3ddd6b397b6dbd5f7424',
                  'artifact_id': 11136039663,
                  'artifact_digest': 'sha256:f0398c310457360100be8267494580e775b67bd18472af55fc989d26d2e94ff6',
                  'calls': 80,
              },
              'provider_ultra_production_shaped_latency': {
                  'run_id': 36944743622,
                  'git_sha': '3faf9fa295ec36e5408e49493c4c9af1c485eeb8',
                  'artifact_id': 11200899429,
                  'artifact_digest': 'sha256:fda633904b36895262dd1c497f5b16f907329e3cfecb63370c0b233c0a7258d2',
                  'calls': 20,
              },
          }

          expected_results = {
              'provider_ultra_raw_http_stream_vs_nonstream_confirmatory': {
                  'stream': {
                      'observed': 60,
                      'p95_total_seconds': 3.0833,
                      'max_total_seconds': 11.2159,
                      'calls_over_slo': 1,
                      'strict_slo_met': True,
                      'p95_headers_to_first_body_seconds': 2.0077,
                  },
                  'nonstream': {
                      'observed': 60,
                      'p95_total_seconds': 2.1221,
                      'max_total_seconds': 2.8839,
                      'calls_over_slo': 0,
                      'strict_slo_met': True,
                      'p95_headers_to_first_body_seconds': 0.0002,
                  },
              },
              'provider_ultra_sdk_vs_raw_http': {
                  'sdk_stream': {
                      'observed': 20,
                      'p95_total_seconds': 2.2042,
                      'calls_over_slo': 0,
                      'strict_slo_met': True,
                      'p95_first_signal_seconds': 1.8662,
                  },
                  'raw_stream': {
                      'observed': 20,
                      'p95_total_seconds': 2.5734,
                      'calls_over_slo': 0,
                      'strict_slo_met': True,
                      'p95_first_signal_seconds': 1.9722,
                  },
                  'sdk_nonstream': {
                      'observed': 20,
                      'p95_total_seconds': 3.4097,
                      'calls_over_slo': 0,
                      'strict_slo_met': True,
                  },
                  'raw_nonstream': {
                      'observed': 20,
                      'p95_total_seconds': 3.2351,
                      'calls_over_slo': 0,
                      'strict_slo_met': True,
                  },
              },
              'provider_ultra_production_shaped_latency': {
                  'aggregate': {
                      'observed': 20,
                      'completed': 20,
                      'p50_total_seconds': 7.846,
                      'p95_total_seconds': 57.3164,
                      'max_total_seconds': 58.4615,
                      'calls_over_slo': 10,
                      'strict_slo_met': False,
                      'total_http_attempts': 23,
                      'total_retries': 3,
                  },
              },
          }

          for item in evidence:
              name = item['experiment']
              assert name in expected
              for key, value in expected[name].items():
                  assert item[key] == value
              assert re.fullmatch(r'sha256:[0-9a-f]{64}', item['artifact_digest'])
              assert item['results'] == expected_results[name]

              if name in {
                  'provider_ultra_raw_http_stream_vs_nonstream_confirmatory',
                  'provider_ultra_sdk_vs_raw_http',
              }:
                  assert item['contract'] == {
                      'prompt': 'Reply with exactly: OK',
                      'max_tokens': 8,
                      'timeout_seconds': 15,
                      'max_retries': 0,
                      'pacing_seconds': 12,
                  }
              else:
                  assert item['complete'] is True
                  assert item['quality_evaluation'] is False
                  assert item['request_ids_present'] is False
                  assert item['contract'] == {
                      'system_instructions_source': 'streamlit_app.py:SYSTEM_INSTRUCTIONS',
                      'system_instructions_sha256': '4c743c2423a91ac2670cc725491a3f2aec850f16c3f8139212519788b4f5f0b3',
                      'max_tokens': 512,
                      'temperature': 1.0,
                      'top_p': 0.95,
                      'enable_thinking': False,
                      'stream': False,
                      'timeout_seconds': 45,
                      'max_retries': 2,
                      'pacing_seconds': 12,
                  }

          minimal = [item for item in evidence if item['experiment'] != 'provider_ultra_production_shaped_latency']
          all_modes = [
              result
              for item in minimal
              for result in item['results'].values()
          ]
          derived_minimal_slo_pass = (
              len(all_modes) == 6
              and all(result['strict_slo_met'] is True for result in all_modes)
              and all(result['p95_total_seconds'] <= data['target_p95_seconds'] for result in all_modes)
              and sum(result['observed'] for result in all_modes) == 200
          )

          production = next(
              item for item in evidence
              if item['experiment'] == 'provider_ultra_production_shaped_latency'
          )
          aggregate = production['results']['aggregate']
          derived_production_shaped_pass = (
              production['complete'] is True
              and production['errors'] == 0
              and aggregate['observed'] == 20
              and aggregate['completed'] == 20
              and aggregate['strict_slo_met'] is True
              and aggregate['p95_total_seconds'] <= data['target_p95_seconds']
          )

          adjudication = data['adjudication']
          assert adjudication['minimal_provider_path_p95_slo_pass'] is derived_minimal_slo_pass
          assert derived_minimal_slo_pass is True
          assert adjudication['production_shaped_latency_evidence_complete'] is True
          assert adjudication['production_shaped_latency_p95_slo_pass'] is derived_production_shaped_pass
          assert derived_production_shaped_pass is False
          assert adjudication['sdk_specific_causal_hypothesis_supported'] is False
          assert adjudication['automatic_transport_or_mode_promotion_authorized'] is False
          assert adjudication['production_workload_certified'] is False

          blockers = set(data['blocking_evidence'])
          required_blockers = {
              'production_shaped_latency_p95_slo_failure',
              'production_quality_evaluation_on_current_main',
              'end_to_end_content_safety_evaluation',
              'provider_privacy_and_data_handling_review',
              'runtime_migration_exact_sha_ci',
              'production_deployment_and_rollback_evidence',
              'independent_human_activation_approval',
          }
          assert required_blockers <= blockers
          assert 'production_shaped_latency_with_real_system_instructions_and_realistic_output_budget' not in blockers

          print('PROVIDER_ULTRA_PRODUCTION_READINESS=PASS')
          PY

      - name: Prove CI is offline only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/provider-ultra-production-readiness-ci.yml').read_text()
          forbidden = (
              'workflow_' + 'dispatch:',
              'push' + ':',
              'schedule' + ':',
              'NVIDIA_' + 'API_KEY',
              'secrets' + '.',
          )
          present = [item for item in forbidden if item in workflow]
          if present:
              raise SystemExit(f'offline-only boundary violated: {present}')
          print('PROVIDER_ULTRA_PRODUCTION_READINESS_OFFLINE_ONLY=PASS')
          PY
