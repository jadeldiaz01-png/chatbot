name: provider-ultra-transport-diagnostic

on:
  pull_request:
    paths:
      - 'scripts/provider_ultra_transport_diagnostic.py'
      - 'Dockerfile.provider-ultra-transport-diagnostic'
      - '.github/workflows/provider-ultra-transport-diagnostic.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/provider_ultra_transport_diagnostic.py'
      - 'Dockerfile.provider-ultra-transport-diagnostic'
      - '.github/workflows/provider-ultra-transport-diagnostic.yml'
  workflow_dispatch:
    inputs:
      repetitions:
        description: Paired sequential repetitions per transport mode
        required: true
        default: '20'
        type: string
      slo_seconds:
        description: Total-latency p95 SLO in seconds
        required: true
        default: '8.0'
        type: string

permissions:
  contents: read

concurrency:
  group: provider-ultra-transport-diagnostic
  cancel-in-progress: false

jobs:
  validate-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate diagnostic source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/provider_ultra_transport_diagnostic.py
          python - <<'PY'
          from pathlib import Path

          text = Path("scripts/provider_ultra_transport_diagnostic.py").read_text(
              encoding="utf-8"
          )
          required = (
              "nvidia/nemotron-3-ultra-550b-a55b",
              "stream=True",
              "stream=False",
              "REQUEST_TIMEOUT_SECONDS = 15.0",
              "MAX_RETRIES = 0",
              "PACING_SECONDS = 12.0",
              "paired_sequential_alternating_order_paced",
              "pacing_seconds_before_call",
              "response_headers_seconds",
              "response_content_types",
              "transport_bytes_downloaded",
              "http_version",
              "errors_with_zero_transport_bytes",
              "errors_with_nonzero_transport_bytes",
              "error_response_content_type",
              "error_code",
              "error_phase",
              "stream_events_observed",
              "stream_content_chunks_observed",
              "first_content_seconds",
              "complete=False",
              "chatbot_functional_configuration_changed",
              "allow_nan=False",
          )
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f"missing Ultra transport diagnostic markers: {missing}")
          if "NVIDIA_API_KEY" not in text:
              raise SystemExit("diagnostic must consume NVIDIA_API_KEY from environment")

          dockerfile = Path(
              "Dockerfile.provider-ultra-transport-diagnostic"
          ).read_text(encoding="utf-8")
          docker_required = (
              "python:3.12-slim-bookworm@sha256:782412e85d0f0984994c290652577d4018aff08145c85b262bb63dc0c7522254",
              "COPY requirements.lock ./",
              "--only-binary=:all:",
              "--require-hashes -r requirements.lock",
              "python -m pip check",
              "COPY scripts/provider_ultra_transport_diagnostic.py",
          )
          docker_missing = [
              item for item in docker_required if item not in dockerfile
          ]
          if docker_missing:
              raise SystemExit(
                  f"missing immutable diagnostic runtime markers: {docker_missing}"
              )
          if "requirements.txt" in dockerfile:
              raise SystemExit(
                  "diagnostic runtime must not resolve dependencies from requirements.txt"
              )

          workflow = Path(
              ".github/workflows/provider-ultra-transport-diagnostic.yml"
          ).read_text(encoding="utf-8")
          if (
              "docker build --pull -f Dockerfile.provider-ultra-transport-diagnostic"
              not in workflow
          ):
              raise SystemExit(
                  "diagnostic workflow must build the dedicated immutable runtime"
              )

          forbidden = (
              "str(exc)",
              "error_message",
              "response.text",
              "response.content",
              "response.json(",
          )
          present_forbidden = [item for item in forbidden if item in text]
          if present_forbidden:
              raise SystemExit(
                  f"unsafe error payload markers present: {present_forbidden}"
              )
          print("PROVIDER_ULTRA_TRANSPORT_DIAGNOSTIC_SOURCE=PASS")
          PY
      - name: Build immutable diagnostic runtime contract
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull \
            -f Dockerfile.provider-ultra-transport-diagnostic \
            -t jadel-chatbot-ultra-transport-diagnostic:pr-validation \
            .

  provider-ultra-transport-diagnostic:
    if: github.event_name != 'pull_request'
    needs: validate-diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: model-evaluation
    env:
      DIAGNOSTIC_REPETITIONS: ${{ inputs.repetitions || '20' }}
      DIAGNOSTIC_SLO_SECONDS: ${{ inputs.slo_seconds || '8.0' }}
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build immutable Python 3.12 diagnostic runtime
        run: docker build --pull -f Dockerfile.provider-ultra-transport-diagnostic -t jadel-chatbot-ultra-transport-diagnostic:${GITHUB_SHA} .
      - name: Run paced paired Ultra streaming vs non-streaming diagnostic
        id: diagnostic
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -u
          if [ -z "${NVIDIA_API_KEY}" ]; then
            echo 'NVIDIA_API_KEY is not configured for the model-evaluation environment' >&2
            exit 2
          fi
          [[ "${DIAGNOSTIC_REPETITIONS}" =~ ^[0-9]+$ ]]
          mkdir -p provider-ultra-transport-diagnostic

          set +e
          docker run --name jadel-chatbot-ultra-transport-diagnostic \
            -e NVIDIA_API_KEY \
            -e GITHUB_SHA="${GITHUB_SHA}" \
            jadel-chatbot-ultra-transport-diagnostic:${GITHUB_SHA} \
            python scripts/provider_ultra_transport_diagnostic.py \
              --repetitions "${DIAGNOSTIC_REPETITIONS}" \
              --slo-seconds "${DIAGNOSTIC_SLO_SECONDS}" \
              --output /tmp/provider-ultra-transport-diagnostic-report.json
          diagnostic_code=$?
          set -e

          docker cp \
            jadel-chatbot-ultra-transport-diagnostic:/tmp/provider-ultra-transport-diagnostic-report.json \
            provider-ultra-transport-diagnostic/report.json || true
          docker rm -f jadel-chatbot-ultra-transport-diagnostic >/dev/null 2>&1 || true
          exit "${diagnostic_code}"
      - name: Upload immutable Ultra transport diagnostic report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: provider-ultra-transport-diagnostic-${{ github.sha }}
          path: provider-ultra-transport-diagnostic/report.json
          if-no-files-found: warn
          retention-days: 30
