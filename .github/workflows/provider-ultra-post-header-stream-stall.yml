name: provider-ultra-post-header-stream-stall

on:
  pull_request:
    paths:
      - 'scripts/provider_ultra_post_header_stream_stall.py'
      - 'tests/test_provider_ultra_post_header_stream_stall.py'
      - 'Dockerfile.provider-ultra-post-header-stream-stall'
      - '.github/workflows/provider-ultra-post-header-stream-stall.yml'
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: 'Exact main SHA explicitly authorized for provider execution'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: provider-ultra-post-header-stream-stall
  cancel-in-progress: false

jobs:
  validate-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Validate diagnostic source contract
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/provider_ultra_transport_diagnostic.py \
            scripts/provider_ultra_post_header_stream_stall.py \
            tests/test_provider_ultra_post_header_stream_stall.py
          python - <<'PY'
          from pathlib import Path

          source = Path(
              "scripts/provider_ultra_post_header_stream_stall.py"
          ).read_text(encoding="utf-8")
          baseline = Path(
              "scripts/provider_ultra_transport_diagnostic.py"
          ).read_text(encoding="utf-8")

          required = (
              'EXPERIMENT_NAME = "provider_ultra_post_header_stream_stall"',
              'EXPERIMENT_SPEC_VERSION = "2026-09-28.1"',
              "CALLS_PER_REPLICATE = 20",
              "REPLICATES = 5",
              "SLO_SECONDS = 8.0",
              "MAX_CONNECTIONS = 1000",
              "KEEPALIVE_EXPIRY_SECONDS = 30.0",
              '"reuse": 100',
              '"no_keepalive": 0',
              "FirstTransportBodyChunkStream",
              "first_transport_body_chunk_seconds",
              "headers_to_first_transport_body_chunk_seconds",
              "first_transport_body_chunk_to_first_event_seconds",
              "first_event_to_first_content_seconds",
              "first_content_to_finish_seconds",
              '"functional_configuration_changed": False',
              '"promotion_authorized": False',
              '"sensitive_payloads_recorded": False',
          )
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit(f"missing post-header diagnostic markers: {missing}")

          baseline_required = (
              'API_BASE_URL = "https://integrate.api.nvidia.com/v1"',
              'ULTRA_MODEL = "nvidia/nemotron-3-ultra-550b-a55b"',
              '"messages": [{"role": "user", "content": "Reply with exactly: OK"}]',
              '"max_tokens": 8',
              '"temperature": 0.0',
              '"top_p": 1.0',
              '"enable_thinking": False',
              "REQUEST_TIMEOUT_SECONDS = 15.0",
              "MAX_RETRIES = 0",
              "PACING_SECONDS = 12.0",
          )
          drift = [item for item in baseline_required if item not in baseline]
          if drift:
              raise SystemExit(f"frozen request contract drifted: {drift}")

          forbidden = (
              "response.text",
              "response.content",
              "response.json(",
              "str(exc)",
              "error_message",
          )
          present = [item for item in forbidden if item in source]
          if present:
              raise SystemExit(f"unsafe payload markers present: {present}")

          print("PROVIDER_POST_HEADER_STREAM_STALL_SOURCE=PASS")
          PY

      - name: Validate immutable diagnostic runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          dockerfile = Path(
              "Dockerfile.provider-ultra-post-header-stream-stall"
          ).read_text(encoding="utf-8")
          required = (
              "python:3.12-slim-bookworm@sha256:782412e85d0f0984994c290652577d4018aff08145c85b262bb63dc0c7522254",
              "COPY requirements.lock ./",
              "--only-binary=:all:",
              "--require-hashes -r requirements.lock",
              "python -m pip check",
              "COPY scripts/provider_ultra_transport_diagnostic.py",
              "COPY scripts/provider_ultra_post_header_stream_stall.py",
              "COPY tests/test_provider_ultra_post_header_stream_stall.py",
          )
          missing = [item for item in required if item not in dockerfile]
          if missing:
              raise SystemExit(f"immutable diagnostic runtime drift: {missing}")
          if "requirements.txt" in dockerfile:
              raise SystemExit("diagnostic runtime must use requirements.lock only")
          print("PROVIDER_POST_HEADER_STREAM_STALL_RUNTIME=PASS")
          PY

      - name: Build immutable diagnostic runtime
        run: |
          set -euo pipefail
          docker build --pull \
            -f Dockerfile.provider-ultra-post-header-stream-stall \
            -t jadel-chatbot-post-header-stall:validation \
            .

      - name: Run offline instrumentation contract tests
        run: |
          set -euo pipefail
          docker run --rm \
            jadel-chatbot-post-header-stall:validation \
            python tests/test_provider_ultra_post_header_stream_stall.py

  provider-ultra-post-header-stream-stall:
    if: github.event_name == 'workflow_dispatch'
    needs: validate-experiment
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: model-evaluation
    steps:
      - name: Enforce exact-SHA human execution boundary
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          if [ "${EXPECTED_MAIN_SHA}" != "${GITHUB_SHA}" ]; then
            echo "EXACT_SHA_AUTHORIZATION=FAIL" >&2
            exit 4
          fi
          echo "EXACT_SHA_AUTHORIZATION=PASS"

      - name: Checkout immutable revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Build immutable diagnostic runtime
        run: |
          set -euo pipefail
          docker build --pull \
            -f Dockerfile.provider-ultra-post-header-stream-stall \
            -t jadel-chatbot-post-header-stall:${GITHUB_SHA} \
            .

      - name: Run preregistered serial post-header stall diagnostic
        id: experiment
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -u
          if [ -z "${NVIDIA_API_KEY}" ]; then
            echo 'NVIDIA_API_KEY is not configured for model-evaluation' >&2
            exit 2
          fi

          mkdir -p provider-ultra-post-header-stream-stall
          overall_code=0

          for replicate in 1 2 3 4 5; do
            for condition in reuse no_keepalive; do
              name="jadel-chatbot-post-header-stall-${condition}-r${replicate}"
              report="/tmp/${condition}-r${replicate}.json"
              host_report="provider-ultra-post-header-stream-stall/${condition}-r${replicate}.json"

              set +e
              docker run --name "${name}" \
                -e NVIDIA_API_KEY \
                -e GITHUB_SHA="${GITHUB_SHA}" \
                jadel-chatbot-post-header-stall:${GITHUB_SHA} \
                python scripts/provider_ultra_post_header_stream_stall.py \
                  --condition "${condition}" \
                  --replicate "${replicate}" \
                  --output "${report}"
              diagnostic_code=$?
              set -e

              docker cp "${name}:${report}" "${host_report}" || overall_code=2
              docker rm -f "${name}" >/dev/null 2>&1 || true

              if [ "${diagnostic_code}" -ne 0 ]; then
                overall_code=2
              fi
            done
          done

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("provider-ultra-post-header-stream-stall")
          expected = [
              root / f"{condition}-r{replicate}.json"
              for replicate in range(1, 6)
              for condition in ("reuse", "no_keepalive")
          ]
          missing = [str(path) for path in expected if not path.is_file()]
          if missing:
              raise SystemExit(f"missing diagnostic reports: {missing}")

          for path in expected:
              report = json.loads(path.read_text(encoding="utf-8"))
              if report.get("complete") is not True:
                  raise SystemExit(f"incomplete diagnostic report: {path}")
              if report.get("git_sha") != os.environ["GITHUB_SHA"]:
                  raise SystemExit(f"SHA mismatch in diagnostic report: {path}")
              if report.get("promotion_authorized") is not False:
                  raise SystemExit(f"promotion contract violated: {path}")
              if report.get("functional_configuration_changed") is not False:
                  raise SystemExit(f"functional contract violated: {path}")
              if report.get("sensitive_payloads_recorded") is not False:
                  raise SystemExit(f"payload-safety contract violated: {path}")
              results = report.get("results")
              if not isinstance(results, list) or len(results) != 20:
                  raise SystemExit(f"unexpected call count: {path}")
              for item in results:
                  required = (
                      "response_headers_seconds",
                      "first_transport_body_chunk_seconds",
                      "first_event_seconds",
                      "first_content_seconds",
                      "total_seconds",
                  )
                  if any(key not in item for key in required):
                      raise SystemExit(f"missing stage field in {path}")

          print("PROVIDER_POST_HEADER_STREAM_STALL_REPORT_SET=COMPLETE")
          PY

          exit "${overall_code}"

      - name: Upload immutable post-header stall reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: provider-ultra-post-header-stream-stall-${{ github.sha }}
          path: provider-ultra-post-header-stream-stall/*.json
          if-no-files-found: warn
          retention-days: 30
