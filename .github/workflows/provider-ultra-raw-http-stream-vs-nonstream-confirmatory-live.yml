name: provider-ultra-raw-http-stream-vs-nonstream-confirmatory-live

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: 'Exact main SHA explicitly authorized for confirmatory provider execution'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: provider-ultra-raw-http-stream-vs-nonstream-confirmatory-live
  cancel-in-progress: false

jobs:
  provider-ultra-raw-http-confirmatory:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: model-evaluation
    steps:
      - name: Enforce exact-SHA human execution boundary
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "MAIN_REF_AUTHORIZATION=FAIL" >&2
            exit 4
          fi
          if [ "${EXPECTED_MAIN_SHA}" != "${GITHUB_SHA}" ]; then
            echo "EXACT_SHA_AUTHORIZATION=FAIL" >&2
            exit 4
          fi
          echo "EXACT_SHA_AUTHORIZATION=PASS"

      - name: Checkout immutable revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install frozen runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir --only-binary=:all: --require-hashes -r requirements.lock

      - name: Validate frozen confirmatory contract
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_provider_ultra_raw_http_stream_vs_nonstream_confirmatory.py
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          from provider_ultra_raw_http_stream_vs_nonstream import (
              FUNCTIONAL_CONFIGURATION_CHANGED, MAX_RETRIES, PACING_SECONDS,
              PROMOTION_AUTHORIZED, REPETITIONS, REQUEST_PATH,
              REQUEST_TIMEOUT_SECONDS, SDK_BYPASSED,
              SENSITIVE_PAYLOADS_RECORDED, SLO_SECONDS,
          )
          from provider_ultra_raw_http_stream_vs_nonstream_confirmatory import (
              BLOCKS, BLOCK_PAUSE_SECONDS,
          )
          assert REQUEST_TIMEOUT_SECONDS == 15.0
          assert MAX_RETRIES == 0
          assert PACING_SECONDS == 12.0
          assert SLO_SECONDS == 8.0
          assert REPETITIONS == 20
          assert BLOCKS == 3
          assert BLOCK_PAUSE_SECONDS == 12.0
          assert REQUEST_PATH == 'raw_httpx2_no_openai_sdk'
          assert SDK_BYPASSED is True
          assert FUNCTIONAL_CONFIGURATION_CHANGED is False
          assert PROMOTION_AUTHORIZED is False
          assert SENSITIVE_PAYLOADS_RECORDED is False
          print('PROVIDER_ULTRA_RAW_HTTP_CONFIRMATORY_LIVE_CONTRACT=PASS')
          PY

      - name: Run preregistered raw HTTP confirmatory replication
        id: experiment
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -u
          mkdir -p provider-ultra-raw-http-confirmatory
          if [ -z "${NVIDIA_API_KEY}" ]; then
            echo 'NVIDIA_API_KEY is not configured for model-evaluation' >&2
            echo 'diagnostic_code=2' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          set +e
          GITHUB_SHA="${GITHUB_SHA}" \
            python scripts/provider_ultra_raw_http_stream_vs_nonstream_confirmatory.py \
              --output-dir provider-ultra-raw-http-confirmatory
          diagnostic_code=$?
          set -e
          echo "diagnostic_code=${diagnostic_code}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Validate immutable confirmatory report set
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_SHA="${GITHUB_SHA}" python - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          root = Path('provider-ultra-raw-http-confirmatory')
          aggregate_path = root / 'aggregate.json'
          block_paths = [root / f'block-{n}.json' for n in range(1, 4)]
          missing = [str(p) for p in [aggregate_path, *block_paths] if not p.is_file()]
          if missing:
              raise SystemExit(f'missing confirmatory reports: {missing}')

          aggregate = json.loads(aggregate_path.read_text(encoding='utf-8'))
          required = {
              'complete': True,
              'git_sha': os.environ['GITHUB_SHA'],
              'experiment': 'provider_ultra_raw_http_stream_vs_nonstream_confirmatory',
              'experiment_spec_version': '2026-09-30.1',
              'blocks_planned': 3,
              'blocks_observed': 3,
              'repetitions_per_mode_per_block': 20,
              'repetitions_per_mode': 60,
              'block_pause_seconds': 12.0,
              'configured_pacing_seconds': 12.0,
              'configured_timeout_seconds': 15.0,
              'configured_max_retries': 0,
              'slo_seconds': 8.0,
              'request_path': 'raw_httpx2_no_openai_sdk',
              'sdk_bypassed': True,
              'functional_configuration_changed': False,
              'promotion_authorized': False,
              'sensitive_payloads_recorded': False,
          }
          for key, expected in required.items():
              if aggregate.get(key) != expected:
                  raise SystemExit(f'aggregate contract mismatch: {key}')

          results = aggregate.get('results')
          if not isinstance(results, list) or len(results) != 120:
              raise SystemExit('unexpected aggregate result count')
          if Counter(item.get('mode') for item in results) != Counter(
              {'stream': 60, 'nonstream': 60}
          ):
              raise SystemExit('unexpected aggregate mode counts')

          forbidden = {'response_text','response_content','response_json','response_body','body'}
          for item in results:
              if forbidden.intersection(item):
                  raise SystemExit('sensitive response payload field present')

          for n, path in enumerate(block_paths, start=1):
              report = json.loads(path.read_text(encoding='utf-8'))
              if report.get('complete') is not True:
                  raise SystemExit(f'incomplete block {n}')
              if report.get('git_sha') != os.environ['GITHUB_SHA']:
                  raise SystemExit(f'block SHA mismatch {n}')
              if report.get('block') != n:
                  raise SystemExit(f'block identity mismatch {n}')
              block_results = report.get('results')
              if not isinstance(block_results, list) or len(block_results) != 40:
                  raise SystemExit(f'unexpected block result count {n}')
              if Counter(item.get('mode') for item in block_results) != Counter(
                  {'stream': 20, 'nonstream': 20}
              ):
                  raise SystemExit(f'unexpected block mode counts {n}')
              if report.get('promotion_authorized') is not False:
                  raise SystemExit(f'promotion contract violated in block {n}')

          print('PROVIDER_ULTRA_RAW_HTTP_CONFIRMATORY_REPORT_SET=COMPLETE')
          PY

      - name: Upload immutable confirmatory report set
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: provider-ultra-raw-http-stream-vs-nonstream-confirmatory-${{ github.sha }}
          path: provider-ultra-raw-http-confirmatory/*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Adjudicate confirmatory diagnostic process exit
        if: always()
        shell: bash
        env:
          DIAGNOSTIC_CODE: ${{ steps.experiment.outputs.diagnostic_code }}
        run: |
          set -euo pipefail
          if [ -z "${DIAGNOSTIC_CODE}" ]; then
            echo "RAW_HTTP_CONFIRMATORY_PROCESS=FAIL_NO_EXIT_CODE" >&2
            exit 3
          fi
          if [ "${DIAGNOSTIC_CODE}" != "0" ]; then
            echo "RAW_HTTP_CONFIRMATORY_PROCESS=FAIL_${DIAGNOSTIC_CODE}" >&2
            exit "${DIAGNOSTIC_CODE}"
          fi
          echo "RAW_HTTP_CONFIRMATORY_PROCESS=PASS"
