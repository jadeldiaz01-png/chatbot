name: provider-ultra-production-shaped-latency-live

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact main SHA authorized for this one diagnostic execution
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: provider-ultra-production-shaped-latency-live
  cancel-in-progress: false

jobs:
  provider-ultra-production-shaped-latency:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: model-evaluation
    env:
      EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
      OUTPUT_DIR: provider-ultra-production-shaped-latency
      REPORT_PATH: provider-ultra-production-shaped-latency/report.json

    steps:
      - name: Enforce exact-SHA human execution boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test -n "${EXPECTED_MAIN_SHA}"
          test "${EXPECTED_MAIN_SHA}" = "${GITHUB_SHA}"
          echo "EXACT_SHA_HUMAN_BOUNDARY=PASS"
          echo "AUTHORIZED_SHA=${GITHUB_SHA}"

      - name: Checkout immutable revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Install frozen runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir --only-binary=:all: --require-hashes -r requirements.lock

      - name: Validate preregistered production-shaped contract
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_provider_ultra_production_shaped_latency.py
          python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path('scripts').resolve()))
          import provider_ultra_production_shaped_latency as probe

          system = probe.load_system_instructions()
          assert probe.EXPERIMENT_NAME == 'provider_ultra_production_shaped_latency'
          assert probe.EXPERIMENT_SPEC_VERSION == '2026-10-01.1'
          assert probe.MODEL == 'nvidia/nemotron-3-ultra-550b-a55b'
          assert probe.prompt_digest(system) == probe.SYSTEM_INSTRUCTIONS_SHA256
          assert probe.MAX_TOKENS == 512
          assert probe.TEMPERATURE == 1.0
          assert probe.TOP_P == 0.95
          assert probe.ENABLE_THINKING is False
          assert probe.STREAM is False
          assert probe.REQUEST_TIMEOUT_SECONDS == 45.0
          assert probe.MAX_RETRIES == 2
          assert probe.PACING_SECONDS == 12.0
          assert probe.SLO_SECONDS == 8.0
          assert probe.REPETITIONS_PER_PROMPT == 4
          assert len(probe.PROMPT_CASES) == 5
          assert probe.TOTAL_PLANNED_CALLS == 20
          assert probe.ATTRIBUTION_SCHEMA_VERSION == '2026-10-02.1'
          assert probe.FUNCTIONAL_CONFIGURATION_CHANGED is False
          assert probe.PRODUCTION_RUNTIME_PARAMETER_CHANGE_AUTHORIZED is False
          assert probe.PROMOTION_AUTHORIZED is False
          assert probe.QUALITY_EVALUATION is False
          assert probe.SENSITIVE_PAYLOADS_RECORDED is False
          print('PRODUCTION_SHAPED_PREREGISTRATION=PASS')
          PY

      - name: Initialize partial evidence envelope
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${OUTPUT_DIR}"
          python - <<'PY'
          import os
          import sys
          from datetime import UTC, datetime
          from pathlib import Path

          sys.path.insert(0, str(Path('scripts').resolve()))
          import provider_ultra_production_shaped_latency as probe

          probe.persist_report(
              os.environ['REPORT_PATH'],
              base_url=probe.DEFAULT_BASE_URL,
              results=[],
              created_at=datetime.now(UTC).isoformat(),
          )
          print('PARTIAL_EVIDENCE_ENVELOPE=READY')
          PY

      - name: Run preregistered production-shaped latency diagnostic
        id: diagnostic
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -u
          if [ -z "${NVIDIA_API_KEY:-}" ]; then
            echo "NVIDIA_API_KEY is not configured for model-evaluation" >&2
            echo "exit_code=2" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          set +e
          python scripts/provider_ultra_production_shaped_latency.py --output "${REPORT_PATH}"
          code=$?
          set -e
          echo "exit_code=${code}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Validate immutable production-shaped report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          report_path = Path(os.environ['REPORT_PATH'])
          if not report_path.is_file():
              raise SystemExit('report.json missing')

          report = json.loads(report_path.read_text(encoding='utf-8'))

          sys.path.insert(0, str(Path('scripts').resolve()))
          import provider_ultra_production_shaped_latency as probe

          assert report['schema_version'] == '1.0'
          assert report['git_sha'] == os.environ['GITHUB_SHA']
          assert report['experiment'] == probe.EXPERIMENT_NAME
          assert report['experiment_spec_version'] == probe.EXPERIMENT_SPEC_VERSION
          assert report['attribution_schema_version'] == probe.ATTRIBUTION_SCHEMA_VERSION
          assert report['attribution_schema_version'] == '2026-10-02.1'
          assert report['provider'] == 'nvidia_nim'
          assert report['api_base_url'] == probe.DEFAULT_BASE_URL
          assert report['model'] == probe.MODEL
          assert report['system_instructions_source'] == probe.SYSTEM_INSTRUCTIONS_SOURCE
          assert report['system_instructions_sha256'] == probe.SYSTEM_INSTRUCTIONS_SHA256
          assert report['repetitions_per_prompt'] == 4
          assert report['total_planned_calls'] == 20
          assert report['target_p95_seconds'] == 8.0
          assert report['functional_configuration_changed'] is False
          assert report['production_runtime_parameter_change_authorized'] is False
          assert report['promotion_authorized'] is False
          assert report['quality_evaluation'] is False
          assert report['sensitive_payloads_recorded'] is False
          assert isinstance(report['complete'], bool)

          assert report['request_contract'] == {
              'max_tokens': 512,
              'temperature': 1.0,
              'top_p': 0.95,
              'enable_thinking': False,
              'stream': False,
              'timeout_seconds': 45.0,
              'max_retries': 2,
              'pacing_seconds': 12.0,
          }

          expected_prompt_hashes = {
              prompt_id: probe.prompt_digest(prompt)
              for prompt_id, prompt in probe.PROMPT_CASES
          }
          assert report['prompt_cases'] == [
              {'id': prompt_id, 'sha256': expected_prompt_hashes[prompt_id]}
              for prompt_id, _ in probe.PROMPT_CASES
          ]

          results = report['results']
          assert isinstance(results, list)
          assert 0 <= len(results) <= 20
          assert report['summary']['planned'] == 20
          assert report['summary']['observed'] == len(results)
          assert report['summary']['completed'] + report['summary']['errors'] == len(results)
          assert report['complete'] is (len(results) == 20)

          summary_attribution = report['summary']['latency_attribution']
          assert summary_attribution['schema_version'] == probe.ATTRIBUTION_SCHEMA_VERSION
          assert summary_attribution['schema_version'] == '2026-10-02.1'
          assert 0 <= summary_attribution['observed_with_attempt_timing'] <= len(results)
          assert set(summary_attribution['retry_cohort']) == {
              'observed',
              'p50_total_seconds',
              'p95_total_seconds',
              'max_total_seconds',
              'calls_over_slo',
          }
          assert set(summary_attribution['no_retry_cohort']) == {
              'observed',
              'p50_total_seconds',
              'p95_total_seconds',
              'max_total_seconds',
              'calls_over_slo',
          }
          assert isinstance(summary_attribution['output_token_buckets'], dict)
          assert isinstance(summary_attribution['output_token_observations'], int)
          assert 0 <= summary_attribution['output_token_observations'] <= len(results)
          for field in (
              'p95_pre_first_request_seconds',
              'p95_final_headers_to_completion_seconds',
              'p95_retry_path_seconds',
          ):
              value = summary_attribution[field]
              assert value is None or isinstance(value, (int, float))

          expected_sample_ids = {
              f'{prompt_id}-r{repetition}'
              for repetition in range(1, 5)
              for prompt_id, _ in probe.PROMPT_CASES
          }
          observed_sample_ids = set()
          forbidden = {
              'prompt',
              'prompt_text',
              'response',
              'response_text',
              'response_body',
              'response_content',
              'system_instructions',
              'authorization',
              'api_key',
          }
          for item in results:
              assert isinstance(item, dict)
              sample_id = item['sample_id']
              assert sample_id in expected_sample_ids
              assert sample_id not in observed_sample_ids
              observed_sample_ids.add(sample_id)
              prompt_id = item['prompt_id']
              assert item['prompt_sha256'] == expected_prompt_hashes[prompt_id]
              assert item['status'] in {'completed', 'infrastructure_error'}
              assert re.fullmatch(r'[0-9a-f]{64}', item['prompt_sha256'])
              assert forbidden.isdisjoint(item.keys())

              attribution = item['latency_attribution']
              assert attribution['schema_version'] == probe.ATTRIBUTION_SCHEMA_VERSION
              assert attribution['schema_version'] == '2026-10-02.1'
              assert isinstance(attribution['attribution_available'], bool)
              for field in (
                  'pre_first_request_seconds',
                  'first_request_to_completion_seconds',
                  'final_headers_to_completion_seconds',
                  'retry_path_seconds',
              ):
                  value = attribution[field]
                  assert value is None or isinstance(value, (int, float))
              assert isinstance(attribution['attempts'], list)
              assert len(attribution['attempts']) == item['http_attempts']
              for attempt_index, attempt in enumerate(attribution['attempts'], start=1):
                  assert attempt['attempt_index'] == attempt_index
                  assert attempt['outcome'] in {
                      'retry_after_headers',
                      'retry_without_headers',
                      'call_completed_after_headers',
                      'call_ended_without_headers',
                  }
                  assert attempt['status_code'] is None or isinstance(
                      attempt['status_code'], int
                  )
                  assert attempt['request_id'] is None or isinstance(
                      attempt['request_id'], str
                  )
                  for field in (
                      'request_to_headers_seconds',
                      'request_to_next_attempt_or_end_seconds',
                      'headers_to_next_attempt_or_end_seconds',
                  ):
                      value = attempt[field]
                      assert value is None or isinstance(value, (int, float))

          if report['complete']:
              assert observed_sample_ids == expected_sample_ids

          print(
              f"PRODUCTION_SHAPED_REPORT=PASS complete={report['complete']} "
              f"observed={len(results)}"
          )
          PY

      - name: Upload immutable production-shaped report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: provider-ultra-production-shaped-latency-${{ github.sha }}
          path: provider-ultra-production-shaped-latency/report.json
          if-no-files-found: error
          retention-days: 30

      - name: Adjudicate diagnostic process completion
        if: always()
        shell: bash
        env:
          DIAGNOSTIC_EXIT_CODE: ${{ steps.diagnostic.outputs.exit_code }}
        run: |
          set -euo pipefail
          test "${DIAGNOSTIC_EXIT_CODE:-missing}" = "0"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ['REPORT_PATH']).read_text(encoding='utf-8'))
          if report.get('complete') is not True:
              raise SystemExit('diagnostic report is partial; live execution is not complete')
          print('PRODUCTION_SHAPED_DIAGNOSTIC_PROCESS=COMPLETE')
          PY
